name: API Automation Tests

on:
  push:
    branches: [main, feature/create-post-api]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm install

      - name: Run API tests
        run: npx playwright test

      - name: Run Cucumber tests
        run: npx cucumber-js